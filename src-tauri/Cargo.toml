[package]
name = "shiyi"
version = "1.2.2"
description = "拾忆：灵感、项目与知识图谱，给人也给 AI 用的桌面应用"
authors = ["Jason"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "shiyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
shiyi-core = { path = "../core" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# `zip` (default) only serves legacy .zip update packages, and every zip 2.x/4.x release is yanked
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
