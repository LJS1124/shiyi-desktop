name: Test

# Runs on every push that touches Rust code: the core's tests (incl. the CLI)
# and a compile check of the desktop shell, on Linux and (for the
# Windows-only code paths) on Windows.
on:
  push:
    branches: [main]
    paths: ['core/**', 'src-tauri/**', 'src/**', 'skills/**', 'scripts/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: cargo test (core + CLI)
        working-directory: core
        run: |
          set -o pipefail
          cargo test --color never 2>&1 | tee ../test.log
      - name: Show failures as annotations
        if: failure()
        run: |
          grep -E "^(error|warning: unused|---- |thread '.*' panicked)" -A 4 test.log | head -40 | sed 's/^/::error::/' || true

  desktop-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: cargo check (desktop app)
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo check --color never --message-format short 2>&1 | tee ../check.log
      - name: Show errors as annotations
        if: failure()
        run: |
          # one annotation per error block, so multi-line errors (dependency resolution) stay readable
          awk '/^(error|warning)(\[|:)/{if(b)print b; b=$0; n=0; next} b&&n<14{b=b"%0A"$0; n++} END{if(b)print b}' check.log | head -20 | sed 's/^/::error::/' || true

  windows:
    # core tests and a compile check of the desktop shell with the Windows-only code
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            src-tauri -> target
      - name: cargo test (core + CLI)
        working-directory: core
        run: cargo test --color never
      - name: cargo check (desktop app)
        working-directory: src-tauri
        run: cargo check --color never --message-format short

  gui-e2e:
    # the real GUI in Chromium against a real database, with the CLI acting as an AI agent
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Build CLI and test bridge
        working-directory: core
        run: cargo build --bins --examples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: End-to-end
        run: |
          python scripts/build-preview.py
          python scripts/e2e/test_app.py e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore
