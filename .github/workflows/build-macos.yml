name: Build macOS app

# Builds run on demand (Actions → Run workflow) and for version tags, so
# day-to-day commits don't spend macOS minutes. A release (with the .dmg
# attached) is published when the run is started with "发布到 Releases"
# ticked, when a tag like v1.1.0 is pushed, or when a release is created
# on GitHub with a new tag.
on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布到 Releases（标签 = v + tauri.conf.json 里的版本号）'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $app in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install

      - name: Build universal app (Apple Silicon + Intel)
        run: npx tauri build --target universal-apple-darwin

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "$GITHUB_WORKSPACE/out/"
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent Shiyi.app "$GITHUB_WORKSPACE/out/Shiyi.app.zip"
          ls -lh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: Shiyi-macOS-universal
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          fi
          notes="docs/releases/$tag.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
            # a release made by hand on GitHub may have no text yet
            if [ -z "$(gh release view "$tag" --json body -q .body)" ] && [ -f "$notes" ]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
          else
            args=(--title "拾忆 $tag" --target "$GITHUB_SHA")
            if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
            gh release create "$tag" out/* "${args[@]}"
          fi
          echo "released $tag: $(gh release view "$tag" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
