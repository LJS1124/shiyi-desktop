name: Build apps

# Builds run on demand (Actions → Run workflow) and for version tags, so
# day-to-day commits don't spend runner minutes. A release (with the .dmg and
# the Windows installer attached) is published when the run is started with
# "发布到 Releases" ticked, when a tag like v1.1.0 is pushed, or when a release
# is created on GitHub with a new tag.
on:
  workflow_dispatch:
    inputs:
      target:
        description: '编译哪个平台'
        type: choice
        options: [all, macos, windows]
        default: all
      release:
        description: '发布到 Releases（标签 = v + tauri.conf.json 里的版本号）'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    if: inputs.target != 'windows'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $app in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install

      - name: Provider logos (open-source LobeHub icons; optional)
        run: |
          npm install --no-save @lobehub/icons-static-svg || echo "::warning::icon package unavailable; letter badges will be shown"
          node scripts/provider-icons.mjs

      - name: Build universal app (Apple Silicon + Intel)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # with the signing key, also build the signed packages the in-app updater installs
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); else echo "::warning::没有配置 TAURI_SIGNING_PRIVATE_KEY，这次不生成自动更新包（应用里只能手动下载更新）"; extra=(); fi
          set -o pipefail
          npx tauri build --target universal-apple-darwin "${extra[@]}" 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          grep -iE "error|failed|signature|private key|password" build.log | grep -viE "^\s*(Compiling|Checking)" | tail -15 | sed 's/^/::error::/' || true

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "$GITHUB_WORKSPACE/out/"
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent Shiyi.app "$GITHUB_WORKSPACE/out/Shiyi.app.zip"
          # signed update package for the in-app updater (only when signing is set up)
          if [ -f Shiyi.app.tar.gz.sig ]; then cp Shiyi.app.tar.gz Shiyi.app.tar.gz.sig "$GITHUB_WORKSPACE/out/"; fi
          ls -lh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: Shiyi-macOS-universal
          path: out/*
          if-no-files-found: error

  windows:
    if: inputs.target != 'macos'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $app in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install

      - name: Provider logos (open-source LobeHub icons; optional)
        run: |
          npm install --no-save @lobehub/icons-static-svg || echo "::warning::icon package unavailable; letter badges will be shown"
          node scripts/provider-icons.mjs

      - name: Build installer (NSIS, x64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # with the signing key, also build the signed packages the in-app updater installs
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); else echo "::warning::没有配置 TAURI_SIGNING_PRIVATE_KEY，这次不生成自动更新包（应用里只能手动下载更新）"; extra=(); fi
          set -o pipefail
          npx tauri build "${extra[@]}" 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          grep -iE "error|failed|signature|private key|password" build.log | grep -viE "^\s*(Compiling|Checking)" | tail -15 | sed 's/^/::error::/' || true

      - name: Command line works from a GUI-subsystem exe
        # what an AI agent does: run `shiyi --cli …` with pipes and read JSON
        env:
          SHIYI_DB: ${{ runner.temp }}/smoke.db
          PYTHONUTF8: '1'
        run: |
          exe=$(ls src-tauri/target/release/*.exe | head -1)
          echo "using $exe"
          fail() { echo "::error::smoke test: $1"; for f in smoke-*.out smoke-*.err; do [ -f "$f" ] && echo "::error::$f: $(head -c 600 "$f" | tr '\r\n' '  ')"; done; exit 1; }
          "$exe" --cli status > smoke-1.out 2> smoke-1.err || fail "status exited with $?"
          python -c "import json; d=json.load(open('smoke-1.out', encoding='utf-8')); assert d['ok'], d" 2> smoke-1.py || fail "status is not ok JSON ($(head -c 300 smoke-1.py))"
          "$exe" --cli idea add "冒烟测试：中文也要能存" --as ci > smoke-2.out 2> smoke-2.err || fail "idea add exited with $?"
          python -c "import json; d=json.load(open('smoke-2.out', encoding='utf-8')); assert d['ok'], d" 2> smoke-2.py || fail "idea add is not ok JSON ($(head -c 300 smoke-2.py))"
          "$exe" --cli search 冒烟 > smoke-3.out 2> smoke-3.err || fail "search exited with $?"
          python -c "import json; t=open('smoke-3.out', encoding='utf-8').read(); assert json.loads(t)['ok'] and '冒烟' in t, t" 2> smoke-3.py || fail "search did not find the Chinese idea ($(head -c 300 smoke-3.py))"
          # and through a pipe, the way most agents read it
          "$exe" --cli status | python -c "import sys, json; assert json.load(sys.stdin)['ok']" || fail "piped output"
          echo "command line ok"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Shiyi-Windows-x64
          path: out/*
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    # runs when nothing failed; a platform skipped by the "target" choice is fine
    if: ${{ !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v') || inputs.release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          fi
          notes="docs/releases/$tag.md"
          # a version is released once: the app only offers an update when the
          # version number changes, so a rebuild under the same number would
          # never reach anyone. Re-uploading the same commit (e.g. adding the
          # Windows build later) is fine.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tagged=$(git ls-remote --tags origin "refs/tags/$tag^{}" "refs/tags/$tag" | tail -1 | cut -f1)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag 已经发布过（来自另一个提交）。先把四处版本号改成新的（tauri.conf.json、两个 Cargo.toml、package.json）并写好 docs/releases/v新版本.md，再发布；否则已安装的应用不会提示更新。"
              exit 1
            fi
          fi
          # latest.json: what the in-app updater reads (version, notes, signed package per platform).
          # Platforms built in an earlier run of the same version are kept.
          mkdir -p prev && gh release download "$tag" -p latest.json -D prev 2>/dev/null || true
          python3 - "$tag" "$notes" <<'PY'
          import datetime, glob, json, os, sys
          tag, notes_file = sys.argv[1], sys.argv[2]
          base = f"https://github.com/LJS1124/shiyi-desktop/releases/download/{tag}/"
          sig = lambda f: open(f + ".sig", encoding="utf-8").read().strip()
          plat = {}
          if os.path.exists("prev/latest.json"):
              prev = json.load(open("prev/latest.json", encoding="utf-8"))
              if prev.get("version") == tag.lstrip("v"):
                  plat.update(prev.get("platforms", {}))
          for f in glob.glob("out/*.app.tar.gz"):
              if os.path.exists(f + ".sig"):
                  e = {"signature": sig(f), "url": base + os.path.basename(f)}
                  plat["darwin-aarch64"] = e
                  plat["darwin-x86_64"] = e
          for f in glob.glob("out/*-setup.exe"):
              if os.path.exists(f + ".sig"):
                  plat["windows-x86_64"] = {"signature": sig(f), "url": base + os.path.basename(f)}
          if plat:
              notes = open(notes_file, encoding="utf-8").read() if os.path.exists(notes_file) else ""
              doc = {"version": tag.lstrip("v"), "notes": notes, "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": plat}
              json.dump(doc, open("out/latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              print("latest.json platforms:", ", ".join(sorted(plat)))
          else:
              print("no signed update packages; latest.json not written")
          PY
          files=(); for f in out/*; do case "$f" in *.sig) ;; *) files+=("$f") ;; esac; done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            # a release made by hand on GitHub may have no text yet
            if [ -z "$(gh release view "$tag" --json body -q .body)" ] && [ -f "$notes" ]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
          else
            args=(--title "拾忆 $tag" --target "$GITHUB_SHA")
            if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
            gh release create "$tag" "${files[@]}" "${args[@]}"
          fi
          echo "released $tag: $(gh release view "$tag" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
