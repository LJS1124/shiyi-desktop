<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾遗</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="skins.css">
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app" id="app">
  <aside class="side clay" id="side" aria-label="导航">
    <div class="side-drag" data-tauri-drag-region></div>
    <div class="brand">
      <span class="seal" aria-hidden="true"><span>拾</span><span>遗</span></span>
      <div>
        <div class="brand-name">拾遗</div>
        <div class="brand-sub">灵感 · 项目 · 进度</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="视图"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main class="main" id="main">
    <header class="topbar" data-tauri-drag-region>
      <form class="capture clay" id="capture" autocomplete="off">
        <div class="seg seg-sm" role="group" aria-label="记录类型">
          <button type="button" data-act="cap-mode" data-v="idea" id="cm-idea">灵感</button>
          <button type="button" data-act="cap-mode" data-v="task" id="cm-task">任务</button>
        </div>
        <input class="cap-input" id="cap-text" aria-label="快速记录" placeholder="记下一个想法…">
        <div class="cap-extra">
          <select class="ctl" id="cap-project" aria-label="所属项目"></select>
          <input class="ctl mono" type="date" id="cap-due" aria-label="截止日期">
        </div>
        <span class="kbd-hint" id="cap-kbd">⌥⇧Space</span>
        <button class="btn btn-primary" type="submit">记下</button>
      </form>
      <button class="icon-btn clay-btn" type="button" data-act="settings" aria-label="设置" title="设置">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M3.5 12.5l1.3-1.3M11.2 4.8l1.3-1.3"/></svg>
      </button>
    </header>
    <div class="view-wrap" id="view-wrap">
      <div id="view" class="view"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden data-act="close-insp"></div>
<aside class="insp clay" id="insp" hidden aria-label="详情"></aside>

<div class="modal" id="modal" hidden>
  <div class="modal-card clay" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal-head"><h2 id="m-title"></h2><button class="icon-btn" type="button" data-act="close-modal" aria-label="关闭" id="m-close"></button></div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-foot" id="m-foot"></div>
  </div>
</div>
<div class="toast clay" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="js/core.js"></script>
<script src="js/views-main.js"></script>
<script src="js/kanban.js"></script>
<script src="js/gantt.js"></script>
<script src="js/burndown.js"></script>
<script src="js/pert.js"></script>
<script src="js/mindmap.js"></script>
<script src="js/ai.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
